packages:
  - "packages/*"
  - "apps/*"
allowBuilds:
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - "@tursodatabase/database-common@0.8.2"
  - "@tursodatabase/database-darwin-arm64@0.8.2"
  - "@tursodatabase/database-linux-arm64-gnu@0.8.2"
  - "@tursodatabase/database-linux-x64-gnu@0.8.2"
  - "@tursodatabase/database-win32-x64-msvc@0.8.2"
  - "@tursodatabase/database@0.8.2"
  - "@tursodatabase/sync-common@0.8.2"
  - "@tursodatabase/sync-darwin-arm64@0.8.2"
  - "@tursodatabase/sync-linux-arm64-gnu@0.8.2"
  - "@tursodatabase/sync-linux-x64-gnu@0.8.2"
  - "@tursodatabase/sync-win32-x64-msvc@0.8.2"
  - "@tursodatabase/sync@0.8.2"
overrides:
  # GHSA-w5hq-g745-h8pq (uuid < 11.1.1). typeid-js 1.2.0 (latest) still depends on uuid ^10;
  # it only calls uuid.v7() and uuid.stringify(), which are API-compatible in 11.x.
  "uuid@<11.1.1": "^11.1.1"
  # GHSA-wq5f-xc86-pv6w (sharp < 0.35.5, librsvg). Only reached through wrangler -> miniflare
  # (reader dev tooling), never shipped in the writer image or the Worker bundle.
  "sharp@<0.35.5": "0.35.5"
