name: Release
# Releases are cut by release-please (docs/releasing.md). Every push to main updates its release
# PR (version bump and CHANGELOG from the conventional commits since the last release) and
# approves the PR's CI runs (release-pr, release-pr-checks). Merging that PR creates the GitHub
# release and tag vX.Y.Z (release-please), and the same run publishes it:
#
#   image-build  the writer image, natively on amd64 and arm64, pushed by digest, then started once
#                on its own architecture (/healthz must report the release's version and commit)
#   image        the multi-arch index ghcr.io/<owner>/waypoint-writer:X.Y.Z (and X.Y, latest,
#                sha-<commit>), with a build provenance attestation on its digest
#   reader       the reader Worker build
#   bundle       waypoint-deploy-X.Y.Z.tgz (scripts/build-release-bundle.sh, naming the image's
#                digest), attested and attached to the release
#   dispatch     starts the deploy workflow of the ops repository, if one is configured
#
# Nothing here uses the Turborepo remote cache: no TURBO_* credentials are set, the Dockerfile turns
# turbo's caches off, and the reader builds with plain `pnpm --filter`. Every third-party action is
# pinned by commit; every job gets only the permissions it needs.
on:
  push:
    branches: [main]
permissions: {}
# One release run at a time, never cancelled midway: a release half-published by a cancelled run
# would need its failed jobs re-run by hand.
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  # Creates the GitHub release and tag when a release PR was merged, and nothing else: the release
  # PR is the next job's. Kept apart so that a failure opening or updating the PR (for instance with
  # "Allow GitHub Actions to create and approve pull requests" off) can't fail this job and skip
  # the publishing jobs, which would leave a release without its image or bundle (a re-run of
  # release-please doesn't report an existing release again).
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release and its tag
      pull-requests: write # labelling the merged release PR as released
      issues: write # the labels
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  # Opens or updates the release PR. After the release job: release-please won't open the next PR
  # while a merged release PR is still untagged. Nothing publishing depends on this job, so its
  # failure fails the run (loudly) but doesn't hold back a release created above.
  release-pr:
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release branch
      pull-requests: write # the release PR
      issues: write # the release PR's labels
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
    steps:
      - id: pr
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  # A PR that GITHUB_TOKEN opens or updates gets its `pull_request` runs (CI, PR title) in an
  # approval-required state: GitHub waits for someone with write access to approve them, and until
  # then the PR has no `ci-ok` and branch protection blocks it. This job approves them with the
  # job's token (scripts/release-pr-approve.sh): only runs of the release branch on the PR's head
  # commit in this repository, never a fork's. If GitHub refuses, or no run turns up, it warns with
  # the fix by hand (the PR's "Approve workflows to run" button) and still succeeds (D59). Only when
  # release-please created or changed the PR.
  release-pr-checks:
    needs: release-pr
    if: needs.release-pr.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # the script
      pull-requests: read # the release PR's head commit
      actions: write # approving its workflow runs
    steps:
      # Only the script the next step runs (scripts/release-dry-run.sh tests it).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/release-pr-approve.sh
          sparse-checkout-cone-mode: false
      - name: Approve the release PR's checks
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.release-pr.outputs.pr }}
        run: bash scripts/release-pr-approve.sh

  image-build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      # Forks publish to their own namespace; image names must be lowercase.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/waypoint-writer" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Pushed by digest only; the `image` job tags the multi-arch index. No buildx provenance or
      # SBOM manifests: the index is attested by actions/attest-build-provenance instead.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/writer/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: WAYPOINT_BUILD_SHA=${{ needs.release-please.outputs.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false
      # The image just pushed, started on its own architecture before the index can name it: a
      # native module that doesn't load (Turso's, say) fails the release here, not on an instance.
      # Local-only (no sync), on a scratch data directory, as the image's own user.
      - name: Start the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.release-please.outputs.version }}
          SHA: ${{ needs.release-please.outputs.sha }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::unexpected digest: $DIGEST"; exit 1; }
          docker run -d --name writer-smoke -p 127.0.0.1:7410:7410 \
            -e WAYPOINT_ENV=dev -e WAYPOINT_SYNC=off -e WAYPOINT_DATA_DIR=/data \
            -e WAYPOINT_HOST=0.0.0.0 -e WAYPOINT_PORT=7410 \
            --tmpfs /data:rw,uid=1000,gid=1000,mode=0700 "$IMAGE@$DIGEST" > /dev/null
          [[ "$(docker inspect -f '{{.Architecture}}' "$IMAGE@$DIGEST")" == "$ARCH" ]] \
            || { echo "::error::the image isn't $ARCH"; exit 1; }
          body=""
          for _ in $(seq 60); do
            body="$(curl -fsS --max-time 3 http://127.0.0.1:7410/healthz 2> /dev/null)" && break
            [[ "$(docker inspect -f '{{.State.Running}}' writer-smoke)" == true ]] || break
            sleep 2
          done
          if ! jq -e --arg v "$VERSION" --arg s "$SHA" '.ok == true and .version == $v and .sha == $s' <<< "${body:-null}" > /dev/null; then
            docker logs writer-smoke 2>&1 | tail -n 50
            echo "::error::the $ARCH image didn't report $VERSION ($SHA) on /healthz: ${body:-no answer}"
            exit 1
          fi
          echo "$ARCH: $body"
          docker rm -f writer-smoke > /dev/null
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 7

  image:
    needs: [release-please, image-build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write # signing the attestation
      attestations: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/waypoint-writer" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: index
        name: Create the multi-arch index
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::unexpected version: $VERSION"; exit 1; }
          sources=()
          for f in digests/*; do sources+=("$IMAGE@sha256:${f#digests/}"); done
          [[ ${#sources[@]} == 2 ]] || { echo "::error::expected two platform images, got ${#sources[@]}"; exit 1; }
          docker buildx imagetools create \
            -t "$IMAGE:$VERSION" -t "$IMAGE:${VERSION%.*}" -t "$IMAGE:latest" -t "$IMAGE:sha-${SHA::7}" \
            "${sources[@]}"
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::unexpected index digest: $digest"; exit 1; }
          # Both platforms, each built from the release commit (upgrade.sh checks the same).
          platforms="$(docker buildx imagetools inspect "$IMAGE@$digest" --raw \
            | jq -r '[.manifests[].platform | "\(.os)/\(.architecture)"] | sort | join(" ")')"
          [[ "$platforms" == "linux/amd64 linux/arm64" ]] || { echo "::error::the index holds $platforms"; exit 1; }
          docker buildx imagetools inspect "$IMAGE@$digest" --format '{{json .Image}}' \
            | jq -e --arg env "WAYPOINT_BUILD_SHA=$SHA" 'to_entries | length == 2 and all(.value.config.Env | index($env))' > /dev/null \
            || { echo "::error::an image wasn't built from $SHA"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published $IMAGE:$VERSION at $digest" >> "$GITHUB_STEP_SUMMARY"
      # The index digest is what instances pull (upgrade.sh, from the bundle's IMAGE_DIGEST) and
      # verify with `gh attestation verify oci://<image>@<digest>`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
          # Storage records exist only for organization-owned repositories.
          create-storage-record: false

  reader:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The same build as upgrade.sh's from a checkout: plain pnpm, no turbo cache.
      - run: pnpm --filter "@waypoint/reader..." build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reader-worker
          path: apps/reader/dist/index.js
          if-no-files-found: error
          retention-days: 7

  # Assembles, checks, attests and uploads the bundle. It runs no package code (the reader was
  # built in its own job without write access), only the bundle script and pinned actions.
  bundle:
    needs: [release-please, image, reader]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release asset
      id-token: write # signing the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reader-worker
          path: release-reader
      # Also fails if any file names the owner's instance (scripts/check-owner-strings.sh).
      - id: build
        name: Build the bundle
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          SHA: ${{ needs.release-please.outputs.sha }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          tgz="$(bash scripts/build-release-bundle.sh --out release-out --version "$VERSION" --sha "$SHA" \
            --image-digest "$DIGEST" --reader release-reader/index.js)"
          echo "tgz=$tgz" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.build.outputs.tgz }}
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          TGZ: ${{ steps.build.outputs.tgz }}
        run: gh release upload "$TAG" "$TGZ" "$TGZ.sha256" --repo "$GITHUB_REPOSITORY" --clobber

  # Starts the deploy workflow of a private ops repository (deploy/ops/deploy.yml.example), which
  # resolves the latest release itself and verifies it before deploying. Configured with the
  # variables DEPLOY_DISPATCH_REPO (owner/repo), DEPLOY_DISPATCH_WORKFLOW (default deploy.yml) and
  # DEPLOY_APP_CLIENT_ID, and the `release` environment's secret DEPLOY_APP_PRIVATE_KEY: a GitHub
  # App that can only dispatch workflows in that repository. Without DEPLOY_DISPATCH_REPO (forks,
  # instances that deploy by hand) the job is skipped.
  dispatch:
    needs: [release-please, image, bundle]
    if: needs.release-please.outputs.release_created == 'true' && vars.DEPLOY_DISPATCH_REPO != ''
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read # the target check's script
    steps:
      # Only the script the next step runs (scripts/release-dry-run.sh tests it).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
          sparse-checkout: scripts/release-dispatch-target.sh
          sparse-checkout-cone-mode: false
      - id: target
        name: Check the target
        env:
          REPO: ${{ vars.DEPLOY_DISPATCH_REPO }}
          WORKFLOW: ${{ vars.DEPLOY_DISPATCH_WORKFLOW || 'deploy.yml' }}
        run: bash scripts/release-dispatch-target.sh
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
          permission-actions: write
      # No inputs: the ops workflow deploys the latest release, after verifying it.
      - name: Dispatch the deploy
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ steps.target.outputs.owner }}/${{ steps.target.outputs.name }}
          WORKFLOW: ${{ steps.target.outputs.workflow }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if gh api --method POST "repos/$REPO/actions/workflows/$WORKFLOW/dispatches" -f ref=main; then
              echo "Dispatched $WORKFLOW in $REPO" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::warning::dispatch attempt $attempt failed"
            sleep $((attempt * 15))
          done
          echo "::error::couldn't dispatch $WORKFLOW in $REPO; run it by hand"
          exit 1
