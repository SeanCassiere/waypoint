name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-prod
  cancel-in-progress: false
jobs:
  deploy:
    # Only a successful CI run for a push to this repository's main branch (or a manual run).
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: [self-hosted, waypoint-deploy]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      # The reader and the workspace packages it bundles; upgrade.sh builds them with plain
      # `pnpm --filter`, without turbo or its cache.
      - run: pnpm install --frozen-lockfile --filter @waypoint/reader... --store-dir /tmp/pnpm-store-waypoint
      # The same path any instance uses (deploy/README.md): build the writer image and the reader
      # from this commit, then the writer and each reader target of the instance file, each one
      # health-gated and rolled back on failure.
      - run: bash deploy/upgrade.sh --instance ~/.config/waypoint/instance.env current-checkout
