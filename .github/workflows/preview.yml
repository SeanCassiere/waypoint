name: Preview
# A Worker Preview of the production reader per pull request, at
# https://pr-<number>-waypoint-reader.seancassiere.workers.dev, behind Cloudflare Access.
# See deploy/README.md#pr-previews and docs/trust-model.md#deploy-pipeline.
#
# SECURITY: the `up` and `down` jobs run on the self-hosted deploy runner, which can read the
# production credentials in ~/.config/waypoint/. GitHub runs a pull_request workflow from the
# PR's own branch, so whoever can push a branch to this repository controls what runs there.
# That's acceptable only because only the owner can push. Never switch this to
# pull_request_target, and never let fork PRs reach the self-hosted jobs. A fork PR would run
# the fork's own copy of this file, so the `if:` conditions below don't stop forks. What does is
# that the repository is private with "Run workflows from fork pull requests" off
# (run_workflows_from_fork_pull_requests: false). Keep that setting off.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
# Each job grants only what it needs.
permissions: {}
concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  # A newer push cancels an in-flight `up`. `closed` waits for it, then deletes the preview.
  cancel-in-progress: ${{ github.event.action != 'closed' }}
jobs:
  # Runs on a GitHub-hosted runner, so a disallowed PR never reaches the self-hosted runner.
  guard:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require a same-repo PR from the owner or an allow-listed bot
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          # Space-separated. Only the owner for now. A bot added here (and to the `if:` of `up`
          # and `down`) runs its PR's code on the deploy runner, so add one only after review.
          ALLOWED_ACTORS: SeanCassiere
        run: |
          [[ "$HEAD_REPO" == "$REPO" ]] || { echo "::error::Previews never run for fork PRs ($HEAD_REPO)"; exit 1; }
          for who in "$ACTOR" "$TRIGGERING_ACTOR"; do
            [[ " $ALLOWED_ACTORS " == *" $who "* ]] || { echo "::error::$who may not run previews"; exit 1; }
          done
          echo "Allowed: $ACTOR (triggered by $TRIGGERING_ACTOR) on $HEAD_REPO"
  # The `if:` repeats the guard's checks: re-running only this job reuses guard's earlier
  # success, possibly with a different triggering actor.
  up:
    needs: guard
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'SeanCassiere' && github.triggering_actor == 'SeanCassiere'
    runs-on: [self-hosted, waypoint-deploy]
    permissions:
      contents: read
    outputs:
      url: ${{ steps.preview.outputs.url }}
      deployment_url: ${{ steps.preview.outputs.deployment_url }}
      deployment_id: ${{ steps.preview.outputs.deployment_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile --filter @waypoint/reader... --store-dir /tmp/pnpm-store-waypoint
      # The reader build (Wrangler's dry-run bundle) and the workspace packages it bundles (`...`),
      # as in CI's build-reader job, before anything is uploaded.
      - run: pnpm --filter "@waypoint/reader..." build
      - run: bash deploy/preview-reader-check.sh
      - id: preview
        run: bash deploy/preview-reader.sh "$PR" up
        env:
          PR: ${{ github.event.pull_request.number }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
  down:
    needs: guard
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'SeanCassiere' && github.triggering_actor == 'SeanCassiere'
    runs-on: [self-hosted, waypoint-deploy]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile --filter @waypoint/reader... --store-dir /tmp/pnpm-store-waypoint
      - run: bash deploy/preview-reader.sh "$PR" down
        env:
          PR: ${{ github.event.pull_request.number }}
  # Upserts one sticky comment. Runs on a GitHub-hosted runner and checks out no code.
  comment:
    needs: [up, down]
    if: always() && (needs.up.result == 'success' || needs.down.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          UP: ${{ needs.up.result == 'success' }}
          URL: ${{ needs.up.outputs.url }}
          DEPLOYMENT_URL: ${{ needs.up.outputs.deployment_url }}
          DEPLOYMENT_ID: ${{ needs.up.outputs.deployment_id }}
        run: |
          marker='<!-- waypoint-reader-preview -->'
          id="$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | awk 'NR == 1')"
          if [[ "$UP" == true ]]; then
            cat > body.md <<EOF
          $marker
          ### Reader preview

          | | |
          |---|---|
          | **Preview** | $URL |
          | **Commit** | \`$SHA\` |
          | **This deployment** | $DEPLOYMENT_URL (\`$DEPLOYMENT_ID\`) |

          - **Owner only.** Cloudflare Access protects it; without signing in, it redirects to the Access login.
          - **Production data, read-only.** It's this PR's reader code with the production read-only Turso token and R2 keys.
          - **Prod share links work here.** Swap \`https://waypoint.pingstash.com\` for the preview URL and keep the \`/s/<token>/c/…\` path.

          The preview updates on every push and is deleted when this PR closes.
          EOF
          else
            [[ -n "$id" ]] || { echo "No preview comment to update"; exit 0; }
            cat > body.md <<EOF
          $marker
          ### Reader preview

          The preview \`pr-$PR\` was deleted when this PR closed (last commit \`$SHA\`).
          EOF
          fi
          if [[ -n "$id" ]]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@body.md --jq .html_url
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@body.md --jq .html_url
          fi
