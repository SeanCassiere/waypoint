name: CI
permissions:
  contents: read
on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs CI on release-please's branch this way (a PR that GITHUB_TOKEN opens
  # or updates triggers no pull_request run), so the release PR gets its `ci-ok` check. The group
  # below is then the branch's ref.
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Independent jobs run in parallel on GitHub-hosted runners. `ci-ok` needs every job and fails
# on any failed, cancelled or skipped one; branch protection on `main` requires it. Actions are
# pinned by commit. Nothing here deploys: instances deploy releases (docs/releasing.md), and no
# workflow of this repository may run on a self-hosted runner (the lint job checks, D58).
#
# Turborepo runs the tasks (turbo.json). Its remote cache (Vercel, signed artifacts) is shared by
# every job, so a task that already ran with the same inputs, in this run or an earlier one, is
# restored instead of rerun. Fork PRs get no secrets: turbo then runs without a remote cache.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
  TURBO_TELEMETRY_DISABLED: "1"
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      # Type-aware oxlint, then the core import guard (`pnpm core:guard`). Workspace packages'
      # types come from source (the `@waypoint/source` export condition), so nothing is built.
      - run: pnpm lint
      # Every shell script (deploy tooling, CI helpers). shellcheck comes with the runner image.
      - run: shellcheck -x deploy/*.sh deploy/lib/*.sh scripts/*.sh
      # No tracked file may name a particular instance (hosts, domains, machines, accounts): deploy
      # tooling takes them from instance.env, docs use example values (scripts/check-owner-strings.sh).
      - run: bash scripts/check-owner-strings.sh
      # Every job of every workflow here runs on a GitHub-hosted runner: no `self-hosted` label,
      # custom label, runner group or unverifiable expression in `runs-on` (D58).
      - run: bash scripts/check-hosted-runners.sh
      # THIRD_PARTY_NOTICES.md holds the license texts of the installed packages the bundles
      # inline (scripts/third-party-notices.ts, from the list in scripts/inlined-packages.json); a
      # dependency that changes its text fails here. A package a bundle inlines that the list
      # misses fails the MCP build (tsdown's deps.onlyBundle) or tests/inlined-packages.test.ts.
      - run: pnpm notices:check
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Each package's source and tests, and the root scripts and configs, from source (no build).
      - run: pnpm typecheck
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: scripts/fetch-tursodb.sh
      # Each package's tests run from source. The integration tests (tests/) also check built
      # artifacts, so turbo builds the writer, the MCP bundles and the reader first. Then the
      # CPU-budget and timing tests, one package at a time (`pnpm test:timing`).
      - run: pnpm test
        env:
          TURSODB_BIN: ${{ github.workspace }}/.tools/turso_cli-x86_64-unknown-linux-gnu/tursodb
  # Builds the reader (Wrangler's dry-run bundle) and the packages it bundles with plain
  # `pnpm --filter`, without turbo or its cache, like deploy/upgrade.sh does, so it doesn't get
  # the cache credentials. Then upgrade.sh's dry run against a scratch instance.
  build-reader:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ""
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The same build deploy/upgrade.sh runs before uploading the reader from a checkout.
      - run: pnpm --filter "@waypoint/reader..." build
      - run: du -h apps/reader/dist/index.js || true
      # upgrade.sh --dry-run with two reader targets: generated Wrangler configs validated by
      # `wrangler deploy --dry-run`, the deploy steps against a stand-in Wrangler, a failed smoke
      # test that must roll back, and instance files that must be refused.
      - run: bash scripts/deploy-dry-run.sh
  # Catches Dockerfile breakage before it reaches the deploy runner (the Dockerfile prunes the
  # workspace to the writer and the MCP package with `turbo prune`, so new packages need no edit).
  # The image always builds from source and never uses the remote cache: the Dockerfile turns off
  # turbo's caches, and this job doesn't get the cache credentials.
  build-writer-image:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ""
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # With the build argument the release images get (release.yml), checked in the image, as are
      # the license and third-party notices the image ships (docs/decisions.md D57).
      - name: Build writer image
        run: |
          docker build -f apps/writer/Dockerfile --build-arg "WAYPOINT_BUILD_SHA=$GITHUB_SHA" -t waypoint-writer:ci .
          docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' waypoint-writer:ci \
            | grep -qx "WAYPOINT_BUILD_SHA=$GITHUB_SHA"
          docker run --rm -i --entrypoint sh waypoint-writer:ci -c \
            'cmp /app/LICENSE - && test -s /app/THIRD_PARTY_NOTICES.md' < LICENSE
  # The adopter install path, for real: deploy/upgrade.sh installs the writer from the merge base's
  # image, upgrades to this commit (current-checkout), rolls back and forward again against the
  # same data directory, rolls back a broken image and an interrupted deploy, keeps the last
  # verified writer as the rollback target after a deploy killed in its external health gate,
  # re-renders, and rolls back a reader deploy killed midway (against a stand-in Wrangler;
  # upgrade.sh builds the reader, so the workspace is installed).
  install-test:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ""
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge base with main (the "old" writer) must be in the clone.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: bash scripts/install-test.sh
  mcp-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Builds the MCP package and its dependencies, then runs the launcher smoke test.
      - run: pnpm turbo run smoke --filter=@waypoint/mcp
  # Real-Chromium checks of the writer viewer (against the built writer) and the public reader
  # shell (from source): CSP, sandboxing, navigation. Neither depends on the test suite.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm test:browser
      - run: pnpm test:browser:reader
  # The release pipeline, without publishing anything: actionlint on every workflow and the ops
  # template, the release-please config, the release bundle (scripts/build-release-bundle.sh) and
  # upgrade.sh's release mode against a fake release with stand-in attestations
  # (scripts/release-dry-run.sh). The reader is built with plain pnpm, as the release does.
  release-dry-run:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ""
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm --filter "@waypoint/reader..." build
      - run: bash scripts/release-dry-run.sh
  ci-ok:
    if: always()
    needs:
      [
        lint,
        typecheck,
        test,
        build-reader,
        build-writer-image,
        install-test,
        mcp-smoke,
        browser,
        release-dry-run,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'to_entries | all(.value.result == "success")' <<<"$NEEDS" > /dev/null
