name: CI
permissions:
  contents: read
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: scripts/fetch-tursodb.sh
      - run: pnpm test
        env:
          TURSODB_BIN: ${{ github.workspace }}/.tools/turso_cli-x86_64-unknown-linux-gnu/tursodb
      - run: pnpm build
      - run: pnpm --filter @waypoint/reader dry-run
      - run: du -h apps/reader/dist/index.js || true
      - run: DRY_RUN=1 bash deploy/deploy-reader.sh dev
      - run: DRY_RUN=1 bash deploy/deploy-reader.sh prod
      - run: if DRY_RUN=1 DRY_RUN_FAIL_SMOKE=1 bash deploy/deploy-reader.sh dev; then exit 1; fi
      - run: pnpm --filter @waypoint/mcp smoke
