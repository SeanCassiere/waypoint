name: CI
permissions:
  contents: read
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Independent jobs run in parallel on GitHub-hosted runners. `ci-ok` needs every job and fails
# on any failed, cancelled or skipped one. Any failed job already makes the workflow's
# conclusion `failure`, so the Deploy workflow (which requires `success`) never runs. `main` has
# no branch protection; if it gets some, require `ci-ok`.
#
# Turborepo runs the tasks (turbo.json). Its remote cache (Vercel, signed artifacts) is shared by
# every job, so a task that already ran with the same inputs, in this run or an earlier one, is
# restored instead of rerun. Fork PRs get no secrets: turbo then runs without a remote cache.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
  TURBO_TELEMETRY_DISABLED: "1"
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      # Type-aware oxlint, then the core import guard (`pnpm core:guard`). Workspace packages'
      # types come from source (the `@waypoint/source` export condition), so nothing is built.
      - run: pnpm lint
      # Every shell script (deploy tooling, CI helpers). shellcheck comes with the runner image.
      - run: shellcheck -x deploy/*.sh deploy/lib/*.sh scripts/*.sh
      # Deploy tooling must take the owner's instance values from instance.env, not the repo.
      - run: bash scripts/check-owner-strings.sh
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Each package's source and tests, and the root scripts and configs, from source (no build).
      - run: pnpm typecheck
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: scripts/fetch-tursodb.sh
      # Each package's tests run from source. The integration tests (tests/) also check built
      # artifacts, so turbo builds the writer and the MCP bundles first. Then the CPU-budget and
      # timing tests, one package at a time (`pnpm test:timing`).
      - run: pnpm test
        env:
          TURSODB_BIN: ${{ github.workspace }}/.tools/turso_cli-x86_64-unknown-linux-gnu/tursodb
  # Builds the reader (Wrangler's dry-run bundle) and the packages it bundles with plain
  # `pnpm --filter`, without turbo or its cache, like deploy/upgrade.sh does, so it doesn't get
  # the cache credentials. Then upgrade.sh's dry run against a scratch instance.
  build-reader:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ""
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ""
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The same build deploy/upgrade.sh runs before uploading the reader from a checkout.
      - run: pnpm --filter "@waypoint/reader..." build
      - run: du -h apps/reader/dist/index.js || true
      # upgrade.sh --dry-run with two reader targets: generated Wrangler configs validated by
      # `wrangler deploy --dry-run`, the deploy steps against a stand-in Wrangler, a failed smoke
      # test that must roll back, and instance files that must be refused.
      - run: bash scripts/deploy-dry-run.sh
  # Catches Dockerfile breakage before it reaches the deploy runner (the Dockerfile prunes the
  # workspace to the writer and the MCP package with `turbo prune`, so new packages need no edit).
  # The image always builds from source and never uses the remote cache: the Dockerfile turns off
  # turbo's caches, and this job doesn't get the cache credentials.
  build-writer-image:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ""
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ""
    steps:
      - uses: actions/checkout@v7
      - name: Build writer image
        run: docker build -f apps/writer/Dockerfile -t waypoint-writer:ci .
  # The adopter install path, for real: deploy/upgrade.sh installs the writer from the merge base's
  # image, upgrades to this commit (current-checkout), rolls back and forward again against the
  # same data directory, rolls back a broken image and an interrupted deploy, and re-renders.
  install-test:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ""
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ""
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge base with main (the "old" writer) must be in the clone.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: bash scripts/install-test.sh
  mcp-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Builds the MCP package and its dependencies, then runs the launcher smoke test.
      - run: pnpm turbo run smoke --filter=@waypoint/mcp
  # Real-Chromium checks of the writer viewer (against the built writer) and the public reader
  # shell (from source): CSP, sandboxing, navigation. Neither depends on the test suite.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm test:browser
      - run: pnpm test:browser:reader
  ci-ok:
    if: always()
    needs:
      [lint, typecheck, test, build-reader, build-writer-image, install-test, mcp-smoke, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'to_entries | all(.value.result == "success")' <<<"$NEEDS" > /dev/null
