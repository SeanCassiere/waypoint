name: Set up Node and pnpm
description: >-
  Installs pnpm and the pinned Node version, restores the pnpm store cache (setup-node keys it on
  pnpm-lock.yaml), and installs the whole workspace from the frozen lockfile. Every job installs
  the full workspace, so whichever job saves the shared cache key first saves a complete store.
  The pinned `turbo` comes with the workspace; it reads TURBO_* (remote cache) from the job's env.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
