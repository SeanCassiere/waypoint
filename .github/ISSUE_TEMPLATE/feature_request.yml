name: Feature request
description: Suggest a change or a new capability.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Waypoint deliberately keeps some things out (see "Non-goals" in docs/overview.md and the
        accepted risks in docs/trust-model.md). It helps to say how a proposal fits with them.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The proposal
      description: What you'd like Waypoint to do. Mention anything it changes for the public reader, share links or the trust model.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you've considered, or how you work around it now.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself (see CONTRIBUTING.md).
