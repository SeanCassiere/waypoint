# Overlay: reach the writer only through its own Tailscale node, over HTTPS, with no host port.
#
#   docker compose -f compose.yaml -f compose.tailscale.yaml ...
#
# The sidecar joins the tailnet as its own node and serves https://<hostname>.<tailnet>.ts.net,
# proxying to the writer on the loopback they share (serve.json). Its node identity lives in the
# <project>_tailscale-state volume: never remove it (no `down --volumes`), or the node needs a new
# auth key.
#
#   WAYPOINT_TS_ENV_FILE    env file holding TS_AUTHKEY, mode 600 (required)
#   WAYPOINT_TS_HOSTNAME    the node's name (default waypoint)
#   WAYPOINT_TS_EXTRA_ARGS  extra `tailscale up` flags, e.g. --advertise-tags=tag:waypoint
#
# Needs Docker Compose 2.24 or later (`!reset`).
services:
  ts-waypoint:
    image: tailscale/tailscale:v1.102.5@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
    hostname: ${WAYPOINT_TS_HOSTNAME:-waypoint}
    env_file: ${WAYPOINT_TS_ENV_FILE:?set WAYPOINT_TS_ENV_FILE}
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      # The auth key is single-use: only log in when no node state exists yet.
      TS_AUTH_ONCE: "true"
      TS_SERVE_CONFIG: /config/serve.json
      TS_EXTRA_ARGS: ${WAYPOINT_TS_EXTRA_ARGS:-}
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  writer:
    network_mode: service:ts-waypoint
    depends_on:
      - ts-waypoint
    # No host port: the sidecar's Serve is the only way in.
    ports: !reset []
    environment:
      # Serve proxies to 127.0.0.1:7410 in the shared namespace; listen nowhere else.
      WAYPOINT_HOST: 127.0.0.1

volumes:
  tailscale-state:
