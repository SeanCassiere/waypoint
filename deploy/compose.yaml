# The Waypoint writer. deploy/upgrade.sh runs it with the values from instance.env; to run it by
# hand, set the variables below yourself (docs/self-hosting.md).
#
#   WAYPOINT_IMAGE            image reference, a tag or a digest (required)
#   WAYPOINT_WRITER_ENV_FILE  the writer's env file, mode 600 (required)
#   WAYPOINT_DATA_HOST_DIR    the data directory on the host, owned by WAYPOINT_UID:WAYPOINT_GID
#                             (required)
#   WAYPOINT_UID, WAYPOINT_GID       the writer's user and group (default 1000:1000)
#   WAYPOINT_BIND_ADDRESS     host address the port is published on (default 127.0.0.1)
#   WAYPOINT_HOST_PORT        host port (default 7410)
#
# The writer has no login: anyone who can reach the port can read and change everything. Keep it
# on the host's loopback, or use compose.tailscale.yaml, which publishes nothing.
#
# Keep the service and volume names: they make the container names (<project>-writer-1) and the
# Tailscale state volume (<project>_tailscale-state) that existing installs depend on.
name: waypoint
services:
  writer:
    image: ${WAYPOINT_IMAGE:?set WAYPOINT_IMAGE}
    env_file: ${WAYPOINT_WRITER_ENV_FILE:?set WAYPOINT_WRITER_ENV_FILE}
    environment:
      WAYPOINT_DATA_DIR: /data
      # The container port is fixed; WAYPOINT_HOST_PORT picks the host side.
      WAYPOINT_PORT: "7410"
      # Listen on every container interface so Docker can publish the port.
      WAYPOINT_HOST: 0.0.0.0
    ports:
      - ${WAYPOINT_BIND_ADDRESS:-127.0.0.1}:${WAYPOINT_HOST_PORT:-7410}:7410
    volumes:
      - ${WAYPOINT_DATA_HOST_DIR:?set WAYPOINT_DATA_HOST_DIR}:/data
    user: "${WAYPOINT_UID:-1000}:${WAYPOINT_GID:-1000}"
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 512
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:7410/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
